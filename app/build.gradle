plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    compileSdk = 36
    buildToolsVersion = '36.0.0'

    defaultConfig {
        applicationId = "com.radionula.nula"
        minSdk = 21
        targetSdk = 36
        versionCode = 23
        versionName = "2.2.7"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        //multiDexEnabled true
    }
    buildTypes {
        release {
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    namespace = "com.radionula.radionula"

    buildFeatures {
        viewBinding = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    ext.koin_version = "4.1.0"

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'

    //implementation 'com.android.support:multidex:2.0.1'

    implementation 'com.mikhaellopez:circularimageview:4.3.1'

    implementation 'com.squareup.retrofit2:retrofit:3.0.0'

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"

    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.1'

    implementation("io.coil-kt:coil:2.7.0")

    // Navigation
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation "androidx.navigation:navigation-fragment-ktx:2.9.1"

    implementation "io.insert-koin:koin-android:$koin_version"

    implementation 'androidx.media3:media3-exoplayer:1.7.1'
    implementation 'androidx.media3:media3-session:1.7.1'
    implementation 'androidx.media3:media3-common:1.7.1'

    // Firebase crashlytics
    implementation 'com.google.firebase:firebase-crashlytics-ktx:19.4.4'
    implementation 'com.google.firebase:firebase-analytics:22.5.0'

    // Core library
    androidTestImplementation 'androidx.test:core:1.6.1'
    testImplementation "androidx.arch.core:core-testing:2.2.0"

    // AndroidJUnitRunner and JUnit Rules
    androidTestImplementation 'androidx.test:rules:1.6.1'


    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2"
    testImplementation 'org.mockito:mockito-core:5.18.0'
    testImplementation "com.nhaarman.mockitokotlin2:mockito-kotlin:2.2.0"
    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'org.mockito:mockito-android:5.18.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
repositories {
    mavenCentral()
}
