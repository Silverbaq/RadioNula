## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
#Sat Jul 05 10:14:39 CEST 2025
android.dependency.useConstraints=true
# Off: every dependency is AndroidX now, and Jetifier was rewriting the
# support-library compat classes that media3-session ships on purpose.
android.enableJetifier=false
# Kept while the release build is new to minification: R8 full mode is stricter
# about keep rules, and this relaxes it. Worth revisiting once a minified
# release has been shipped and verified.
android.r8.strictFullModeForKeepRules=false
android.useAndroidX=true
# 1536M was enough for the Android-only build, but the Kotlin/Native compiler
# runs inside this daemon and a release framework link dies on it with
# "Compilation failed: Java heap space" - the debug link, which does far less
# whole-program work, survives. So an iOS release build needs this.
org.gradle.jvmargs=-Xmx4G
